[package]
name = "presupuestos-demo-core"
version = "0.1.0"
description = "Núcleo de la demo web: dominio y PDF de la app compilados a WebAssembly"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Mismas versiones que src-tauri/Cargo.toml para el código compartido (dominio, PDF y errores).
[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
rustybuzz = "0.20"
time = "0.3"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Solo la depuración: wasm-bindgen necesita la sección `target_features`.
strip = "debuginfo"
