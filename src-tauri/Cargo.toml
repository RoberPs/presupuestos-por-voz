[package]
name = "presupuestos-por-voz"
version = "0.1.0"
description = "Presupuestos por Voz"
edition = "2021"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
